<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 540" role="img">
  <title>ask-matt main flow and on-ramps</title>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#174c3c"/>
    </marker>
    <marker id="arrow-warm" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8b5d33"/>
    </marker>
  </defs>
  <rect width="1120" height="540" rx="18" fill="#fbf8f1"/>
  <text x="40" y="42" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#1f2a21">ask-matt：主线是公路，上坡入口从侧面并入</text>
  <text x="40" y="68" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#536255">单 session 可从 grill-with-docs 直达 implement；多 session 才走 to-spec → to-tickets</text>
  <g font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" text-anchor="middle">
    <rect x="36" y="118" width="88" height="52" rx="10" fill="#f0dfc6" stroke="#8b5d33" stroke-width="1.2"/>
    <text x="80" y="149" fill="#1f2a21">idea</text>
    <rect x="168" y="112" width="176" height="64" rx="10" fill="#174c3c"/>
    <text x="256" y="140" fill="#f7faf7">grill-with-docs</text>
    <text x="256" y="158" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#d9e6de">工作目录默认起点</text>
    <rect x="400" y="112" width="120" height="64" rx="10" fill="#d9e6de" stroke="#174c3c" stroke-width="1.2"/>
    <text x="460" y="140" fill="#174c3c">to-spec</text>
    <text x="460" y="158" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#536255">写成可交付说明</text>
    <rect x="576" y="112" width="128" height="64" rx="10" fill="#d9e6de" stroke="#174c3c" stroke-width="1.2"/>
    <text x="640" y="140" fill="#174c3c">to-tickets</text>
    <text x="640" y="158" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#536255">vertical slice</text>
    <rect x="760" y="112" width="140" height="64" rx="10" fill="#174c3c"/>
    <text x="830" y="140" fill="#f7faf7">implement</text>
    <text x="830" y="158" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#d9e6de">内部 tdd → review</text>
    <rect x="956" y="118" width="128" height="52" rx="10" fill="#f0dfc6" stroke="#8b5d33" stroke-width="1.2"/>
    <text x="1020" y="149" fill="#1f2a21">code-review</text>
  </g>
  <line x1="124" y1="144" x2="166" y2="144" stroke="#174c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="344" y1="144" x2="398" y2="144" stroke="#174c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="144" x2="574" y2="144" stroke="#174c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="704" y1="144" x2="758" y2="144" stroke="#174c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="144" x2="954" y2="144" stroke="#174c3c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M344,112 C344,78 760,78 760,112" fill="none" stroke="#8b5d33" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-warm)"/>
  <text x="552" y="72" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#8b5d33" text-anchor="middle">单 session：跳过拆票，直达 implement</text>
  <rect x="168" y="220" width="176" height="44" rx="10" fill="#fff" stroke="#8b5d33" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="256" y="247" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#8b5d33" text-anchor="middle">prototype 绕路</text>
  <path d="M210,176 L210,220" fill="none" stroke="#8b5d33" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-warm)"/>
  <path d="M302,220 L302,176" fill="none" stroke="#8b5d33" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-warm)"/>
  <text x="356" y="206" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#8b5d33">两边都用 /handoff</text>
  <text x="40" y="310" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="700" fill="#8b5d33">上坡入口（还进不了主线时）</text>
  <rect x="36" y="328" width="210" height="56" rx="10" fill="#fff" stroke="#174c3c" stroke-width="1.2"/>
  <text x="141" y="351" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#174c3c" text-anchor="middle">triage</text>
  <text x="141" y="369" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#536255" text-anchor="middle">外来工单 → agent-ready</text>
  <rect x="36" y="400" width="210" height="56" rx="10" fill="#fff" stroke="#174c3c" stroke-width="1.2"/>
  <text x="141" y="423" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#174c3c" text-anchor="middle">diagnosing-bugs</text>
  <text x="141" y="441" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#536255" text-anchor="middle">先有变红的反馈回路</text>
  <rect x="290" y="364" width="210" height="56" rx="10" fill="#fff" stroke="#174c3c" stroke-width="1.2"/>
  <text x="395" y="387" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="13" fill="#174c3c" text-anchor="middle">wayfinder</text>
  <text x="395" y="405" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#536255" text-anchor="middle">大而有雾 → 决策地图</text>
  <path d="M246,356 C520,356 710,210 760,176" fill="none" stroke="#174c3c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M246,428 C500,428 710,230 760,176" fill="none" stroke="#174c3c" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M500,392 C520,392 460,210 460,176" fill="none" stroke="#174c3c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="680" y="340" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#536255">triage / 修 bug 并入 implement</text>
  <text x="520" y="312" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#536255">wayfinder 清图后交到 to-spec，不直接 implement</text>
  <text x="40" y="516" font-family="Source Han Sans SC, Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#536255">虚线 = 绕路或可跳过的捷径。实心绿块 = 主线上最常走的两站。</text>
</svg>
