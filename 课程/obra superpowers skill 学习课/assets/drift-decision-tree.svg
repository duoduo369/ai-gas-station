<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">跑偏与漏实现分流图</title>
  <desc id="desc">当实现被发现跑偏、漏实现或 review 指出缺口时，判断是补实现、改 plan，还是回到 spec 的决策图。</desc>
  <defs>
    <style>
      .bg { fill: #f9fbfc; }
      .box { fill: #ffffff; stroke: #0e5a6b; stroke-width: 2; rx: 22; }
      .soft { fill: #d8edf2; stroke: #0e5a6b; stroke-width: 2; rx: 22; }
      .warm { fill: #f8e3d3; stroke: #c26b2b; stroke-width: 2; rx: 22; }
      .title { font: 700 28px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #083945; }
      .label { font: 700 20px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #083945; }
      .text { font: 16px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #1b2430; }
      .small { font: 15px "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #586474; }
      .arrow { stroke: #0e5a6b; stroke-width: 3; fill: none; marker-end: url(#arrowHead); }
      .warmArrow { stroke: #c26b2b; stroke-width: 3; fill: none; marker-end: url(#warmArrowHead); }
      .decision { fill: #ffffff; stroke: #0e5a6b; stroke-width: 2; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e5a6b"/>
    </marker>
    <marker id="warmArrowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c26b2b"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760" rx="28"/>
  <text x="60" y="58" class="title">实现跑偏 / 漏实现时怎么分流</text>

  <rect class="box" x="435" y="90" width="330" height="92"/>
  <text x="468" y="128" class="label">发现缺口</text>
  <text x="468" y="156" class="text">人验收 / reviewer / final review 发现：</text>
  <text x="468" y="178" class="text">实现跑偏、少了、或和预期不一致。</text>

  <polygon class="decision" points="600,230 735,310 600,390 465,310"/>
  <text x="534" y="302" class="label">Spec 本身</text>
  <text x="532" y="330" class="label">还对吗？</text>

  <polygon class="decision" points="310,430 455,512 310,594 165,512"/>
  <text x="242" y="500" class="label">Plan 也对吗？</text>
  <text x="214" y="528" class="text">task 拆分、顺序、约束</text>
  <text x="226" y="552" class="text">有没有传到底？</text>

  <rect class="soft" x="60" y="630" width="320" height="116"/>
  <text x="92" y="670" class="label">实现缺口</text>
  <text x="92" y="700" class="text">Spec 对，Plan 也对，</text>
  <text x="92" y="726" class="text">只是代码没跟上。</text>

  <rect class="soft" x="430" y="630" width="340" height="116"/>
  <text x="462" y="670" class="label">Plan 缺口</text>
  <text x="462" y="700" class="text">Spec 对，但任务拆分坏了、</text>
  <text x="462" y="726" class="text">顺序不对，或约束没下传。</text>

  <rect class="warm" x="820" y="470" width="320" height="136"/>
  <text x="852" y="510" class="label">Spec 不再 authoritative</text>
  <text x="852" y="540" class="text">需求变了、边界变了、</text>
  <text x="852" y="566" class="text">原 spec 写漏或写错。</text>
  <text x="852" y="592" class="text">先修 spec，再刷新 plan。</text>

  <path class="arrow" d="M600 182 V230"/>
  <path class="arrow" d="M465 310 H310 V430"/>
  <path class="arrow" d="M310 594 V630 H220"/>
  <path class="arrow" d="M455 512 H600 V630"/>
  <path class="warmArrow" d="M735 310 H980 V470"/>

  <text x="236" y="296" class="small">Yes，先继续问：plan 有没有把要求传到底</text>
  <text x="96" y="614" class="small">Yes：补实现 / 补缺的 task / 重跑 review</text>
  <text x="446" y="614" class="small">No：先改 plan，再继续执行</text>
  <text x="858" y="296" class="small">No：行为定义本身变了，回 spec 层</text>

  <rect class="box" x="140" y="390" width="620" height="28"/>
  <text x="170" y="410" class="small">Spec 还对，不等于可以直接补代码；还要继续判断 plan 有没有把正确要求传到实现层。</text>
</svg>
